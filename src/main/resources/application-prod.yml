spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:v8n_db}
    username: ${DB_USERNAME:v8n_ecom}
    password: '${DB_PASSWORD:#123456@}'
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  storage:
    base-url: ${STORAGE_BASE_URL}
    minio: # Case 2: cloud storage
      endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
      access-key: ${MINIO_ACCESS_KEY:minioadmin}
      secret-key: ${MINIO_SECRET_KEY:minioadmin}
      bucket: ${MINIO_BUCKET:avatars}
      region: ${MINIO_REGION:us-east-1}
      public-url-prefix: ${MINIO_PUBLIC_URL:http://localhost:9000}
