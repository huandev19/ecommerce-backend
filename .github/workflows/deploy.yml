name: Deploy to VPS

on:
  push:
    branches: [main, dev]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Build with Gradle
        run: ./gradlew clean build -x test

      - name: Upload JAR to VPS
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_DEPLOY_KEY }}" > ~/.ssh/vps_deploy_key
          chmod 600 ~/.ssh/vps_deploy_key
          # scp trên ubuntu-latest (24.04) dùng SFTP protocol mặc định → tương thích internal-sftp
          cd build/libs && scp -o StrictHostKeyChecking=no -o HostKeyAlgorithms=+ssh-ed25519 -i ~/.ssh/vps_deploy_key *.jar vps@${{ secrets.VPS_HOST }}:/backend/

      - name: Ensure & Restart service on VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            SERVICE_FILE=/etc/systemd/system/v8n-ecommerce.service

            if [ ! -f "$SERVICE_FILE" ]; then
              echo "Creating systemd service..."
              sudo tee "$SERVICE_FILE" > /dev/null << 'SVC_EOF'
            [Unit]
            Description=V8N Ecommerce Backend
            After=network.target postgresql.service

            [Service]
            User=root
            WorkingDirectory=/www/v8n_ecommerce/backend
            ExecStart=/usr/bin/java -jar /www/v8n_ecommerce/backend/v8n-ecommerce-0.0.1-SNAPSHOT.jar --spring.profiles.active=prod
            SuccessExitStatus=143
            TimeoutStopSec=10
            Restart=on-failure
            RestartSec=5

            [Install]
            WantedBy=multi-user.target
            SVC_EOF
              sudo systemctl daemon-reload
              sudo systemctl enable v8n-ecommerce
            fi

            sudo systemctl restart v8n-ecommerce
            sudo systemctl status v8n-ecommerce --no-pager