name: Deploy to VPS

on:
  push:
    branches: [main, dev]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Build with Gradle
        run: ./gradlew clean build -x test

      - name: Upload JAR to VPS
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: vps
          key: ${{ secrets.VPS_DEPLOY_KEY }}
          source: "build/libs/*.jar"
          target: "/backend/"
          # Cắt 2 cấp: build/ → libs/
          # Kết quả: JAR nằm trực tiếp trong /backend/ (tức /www/v8n_ecommerce/backend/ trên VPS)
          strip_components: 2

      - name: Restart service on VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            sudo systemctl restart v8n-ecommerce
            sudo systemctl status v8n-ecommerce --no-pager